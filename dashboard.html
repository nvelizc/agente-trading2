<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente de trading - Dashboard</title>
<style>
  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --card-hover: #151d2e;
    --border: #1e2939;
    --border-strong: #2a3850;
    --text: #e5e9f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --blue: #3b82f6;
    --blue-bg: #132039;
    --blue-text: #7db4ff;
    --green: #22c55e;
    --green-bg: #0f2a1a;
    --green-text: #4ade80;
    --red: #ef4444;
    --red-bg: #2a1414;
    --red-text: #f87171;
    --amber: #f59e0b;
    --amber-bg: #2a2010;
    --amber-text: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 8px;
  }
  .header h1 { font-size: 19px; font-weight: 600; margin: 0; color: var(--text); }
  .header .updated { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  button {
    border: 1px solid var(--border-strong); background: var(--card); border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--text);
  }
  button:hover { background: var(--card-hover); border-color: var(--blue); }
  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .metric { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .metric .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .metric .value { font-size: 22px; font-weight: 600; color: var(--blue-text); }
  .filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  select {
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; background: var(--card); color: var(--text);
  }
  .sector-tag {
    display: inline-block; font-size: 11px; color: var(--blue-text);
    background: var(--blue-bg); border-radius: 6px; padding: 2px 8px; margin-left: 8px;
  }
  #signals-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px;
  }
  .signal {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px;
  }
  .signal.tiene-señal { border-color: var(--border-strong); }
  .signal-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ticker { font-weight: 600; font-size: 16px; color: var(--text); }
  .setup { font-size: 12px; color: var(--text-muted); text-transform: capitalize; margin-left: 8px; }
  .precio-actual { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
  .badge.long { background: var(--green-bg); color: var(--green-text); }
  .badge.short { background: var(--red-bg); color: var(--red-text); }
  .badge.alta { background: var(--green-bg); color: var(--green-text); }
  .badge.media { background: var(--amber-bg); color: var(--amber-text); }
  .badge.baja { background: var(--card-hover); color: var(--text-secondary); }
  .badge.alcista { background: var(--green-bg); color: var(--green-text); }
  .badge.bajista { background: var(--red-bg); color: var(--red-text); }
  .badge.lateral { background: var(--card-hover); color: var(--text-secondary); }
  .chart-wrap { position: relative; height: 70px; margin: 10px 0; }
  .grid-datos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 8px; font-size: 13px; margin-bottom: 10px;
  }
  .grid-datos .l { color: var(--text-muted); font-size: 11px; }
  .grid-datos .v { font-weight: 600; color: var(--text); }
  .v.stop { color: var(--red-text); }
  .v.obj { color: var(--green-text); }
  .razon { font-size: 13px; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 10px; line-height: 1.5; }
  .noticias {
    margin-top: 10px; padding-top: 0; border-top: none;
    background: var(--blue-bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px;
  }
  .noticias-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .noticias-label { font-size: 11px; color: var(--blue-text); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .noticias-texto { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .headlines { margin-top: 10px; }
  .headline-item {
    font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border);
  }
  .headline-item a { color: var(--text); text-decoration: none; }
  .headline-item a:hover { color: var(--blue-text); text-decoration: underline; }
  .headline-fuente { color: var(--text-muted); font-size: 11px; display: block; margin-top: 2px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
  .disclaimer { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 30px; }
</style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Agente de trading</h1>
      <div class="updated" id="updated-label">Cargando...</div>
    </div>
    <button id="refresh-btn">Actualizar</button>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="filters">
    <select id="filter-confianza">
      <option value="todas">Toda confianza</option>
      <option value="alta">Confianza alta</option>
      <option value="media">Confianza media</option>
      <option value="baja">Confianza baja</option>
    </select>
    <select id="filter-direccion">
      <option value="todas">Long y short</option>
      <option value="long">Solo long</option>
      <option value="short">Solo short</option>
    </select>
    <select id="filter-sector">
      <option value="todos">Todos los sectores</option>
    </select>
  </div>

  <div id="signals-list"></div>

  <div class="disclaimer">Esto no es asesoría financiera. Verificá cada señal antes de operar en XTB.</div>

<script>
let currentData = null;

function sparklineSVG(historial, ancho = 300, alto = 56) {
  if (!historial || historial.length < 2) return "";
  const valores = historial.map(p => p.cierre);
  const min = Math.min(...valores);
  const max = Math.max(...valores);
  const rango = (max - min) || 1;
  const paso = ancho / (valores.length - 1);
  const puntos = valores.map((v, i) => {
    const x = i * paso;
    const y = alto - ((v - min) / rango) * (alto - 8) - 4;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const subiendo = valores[valores.length - 1] >= valores[0];
  const color = subiendo ? "#4ade80" : "#f87171";
  const colorFondo = subiendo ? "rgba(34,197,94,0.15)" : "rgba(239,68,68,0.15)";
  const areaPuntos = `0,${alto} ${puntos} ${ancho},${alto}`;
  return `<svg viewBox="0 0 ${ancho} ${alto}" width="100%" height="${alto}" preserveAspectRatio="none">
    <polyline points="${areaPuntos}" fill="${colorFondo}" stroke="none"></polyline>
    <polyline points="${puntos}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></polyline>
  </svg>`;
}

function badgeDireccion(d) {
  if (d === "long") return `<span class="badge long">↑ Long</span>`;
  if (d === "short") return `<span class="badge short">↓ Short</span>`;
  return "";
}
function badgeConfianza(c) {
  if (!c) return "";
  return `<span class="badge ${c}">Confianza ${c}</span>`;
}
function badgePerspectiva(p) {
  if (!p) return "";
  const etiquetas = { alcista: "↑ Alcista", bajista: "↓ Bajista", lateral: "→ Lateral" };
  return `<span class="badge ${p}">${etiquetas[p] || p}</span>`;
}

function formatFecha(iso) {
  const d = new Date(iso);
  return d.toLocaleString("es-CL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function renderMetrics(resultados) {
  const conSeñal = resultados.filter(r => r.hay_señal);
  const altaConfianza = conSeñal.filter(r => r.confianza === "alta");
  const ratios = conSeñal.map(r => r.ratio_riesgo_beneficio).filter(Boolean);
  const ratioProm = ratios.length ? (ratios.reduce((a, b) => a + b, 0) / ratios.length).toFixed(1) : "-";

  const metrics = [
    { label: "Activos escaneados", value: resultados.length },
    { label: "Señales encontradas", value: conSeñal.length },
    { label: "Confianza alta", value: altaConfianza.length },
    { label: "Ratio R:B promedio", value: ratioProm === "-" ? "-" : `1:${ratioProm}` }
  ];

  document.getElementById("metrics").innerHTML = metrics.map(m => `
    <div class="metric">
      <div class="label">${m.label}</div>
      <div class="value">${m.value}</div>
    </div>
  `).join("");
}

function poblarSectores(resultados) {
  const select = document.getElementById("filter-sector");
  const actuales = new Set(Array.from(select.options).map(o => o.value));
  const sectores = [...new Set(resultados.map(r => r.sector).filter(Boolean))].sort();
  sectores.forEach(s => {
    if (!actuales.has(s)) {
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = s;
      select.appendChild(opt);
    }
  });
}

function idSeguro(ticker) {
  return "chart-" + ticker.replace(/[^a-zA-Z0-9]/g, "");
}

function renderSignals() {
  if (!currentData) return;
  const confFiltro = document.getElementById("filter-confianza").value;
  const dirFiltro = document.getElementById("filter-direccion").value;
  const sectorFiltro = document.getElementById("filter-sector").value;

  let items = currentData.resultados.slice();
  items = items.filter(r => {
    if (confFiltro !== "todas" && r.confianza !== confFiltro) return false;
    if (dirFiltro !== "todas" && r.direccion !== dirFiltro) return false;
    if (sectorFiltro !== "todos" && r.sector !== sectorFiltro) return false;
    return true;
  });

  const list = document.getElementById("signals-list");

  if (items.length === 0) {
    list.innerHTML = `<div class="empty">No hay resultados con estos filtros.</div>`;
    return;
  }

  list.innerHTML = items.map(r => {
    const sectorTag = r.sector ? `<span class="sector-tag">${r.sector}</span>` : "";
    const precioTag = r.precio_al_momento_del_analisis ? `<span class="precio-actual">$${r.precio_al_momento_del_analisis}</span>` : "";

    const bloqueNoticias = r.noticias_prediccion ? `
      <div class="noticias">
        <div class="noticias-top">
          <span class="noticias-label">Predicción IA</span>
          ${badgePerspectiva(r.noticias_perspectiva)}
        </div>
        <div class="noticias-texto">${r.noticias_prediccion}</div>
      </div>` : "";

    const headlines = (r.noticias && r.noticias.length) ? `
      <div class="headlines">
        ${r.noticias.map(n => `
          <div class="headline-item">
            <a href="${n.link || '#'}" target="_blank" rel="noopener">${n.titulo}</a>
            ${n.fuente ? `<span class="headline-fuente">${n.fuente}</span>` : ""}
          </div>
        `).join("")}
      </div>` : "";

    const grafico = (r.historial_precios && r.historial_precios.length > 1) ? `
      <div class="chart-wrap">${sparklineSVG(r.historial_precios)}</div>` : "";

    if (!r.hay_señal) {
      return `
        <div class="signal">
          <div class="signal-top">
            <div><span class="ticker">${r.ticker}</span>${precioTag}${sectorTag}<span class="setup" style="margin-left:8px;">Sin señal técnica</span></div>
          </div>
          ${grafico}
          <div class="razon">${r.razon || ""}</div>
          ${bloqueNoticias}
          ${headlines}
        </div>`;
    }
    return `
      <div class="signal tiene-señal">
        <div class="signal-top">
          <div><span class="ticker">${r.ticker}</span>${precioTag}${sectorTag}<span class="setup">${r.tipo_setup || ""}</span></div>
          <div class="badges">${badgeDireccion(r.direccion)}${badgeConfianza(r.confianza)}</div>
        </div>
        ${grafico}
        <div class="grid-datos">
          <div><div class="l">Entrada</div><div class="v">${r.entrada}</div></div>
          <div><div class="l">Stop loss</div><div class="v stop">${r.stop_loss}</div></div>
          <div><div class="l">Objetivo</div><div class="v obj">${r.objetivo}</div></div>
          <div><div class="l">Ratio R:B</div><div class="v">1:${r.ratio_riesgo_beneficio}</div></div>
        </div>
        <div class="razon">${r.razon || ""}</div>
        ${bloqueNoticias}
        ${headlines}
      </div>`;
  }).join("");
}

async function loadData() {
  document.getElementById("updated-label").textContent = "Cargando...";
  let data;
  try {
    const res = await fetch("logs/latest.json?_=" + Date.now());
    if (!res.ok) throw new Error("no data yet");
    data = await res.json();
  } catch (e) {
    document.getElementById("updated-label").textContent = "Todavía no hay datos (esperá al primer escaneo automático o corré el workflow a mano).";
    document.getElementById("metrics").innerHTML = "";
    document.getElementById("signals-list").innerHTML = "";
    return;
  }

  currentData = data;
  document.getElementById("updated-label").textContent = "Último escaneo: " + formatFecha(data.actualizado);
  try {
    renderMetrics(data.resultados);
    poblarSectores(data.resultados);
    renderSignals();
  } catch (e) {
    console.error("Error al renderizar el dashboard", e);
  }
}

document.getElementById("filter-confianza").addEventListener("change", renderSignals);
document.getElementById("filter-direccion").addEventListener("change", renderSignals);
document.getElementById("filter-sector").addEventListener("change", renderSignals);
document.getElementById("refresh-btn").addEventListener("click", loadData);

loadData();
</script>
</body>
</html>
